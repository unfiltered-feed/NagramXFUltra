name: Build NagramXF Optimized APK

# Этот workflow:
# 1. Применяет патч nagramxf-lazy-connect.patch (если файл есть в корне репо)
# 2. Собирает arm64-v8a release APK
# 3. Выкладывает APK в Artifacts для скачивания
#
# Перед запуском убедись, что файл nagramxf-lazy-connect.patch
# лежит в КОРНЕ репозитория (рядом с README.md, build.gradle и т.д.)

on:
  workflow_dispatch:  # ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply lazy-connect patch
        run: |
          if [ -f nagramxf-lazy-connect.patch ]; then
            echo "Found patch file, applying..."
            git apply --check nagramxf-lazy-connect.patch && git apply nagramxf-lazy-connect.patch
            echo "Patch applied successfully"
            grep -A 5 "NAGRAMXF-OPTIMIZATION" TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java || true
          else
            echo "No patch file found, building without patch"
          fi

      - name: Build arm64-v8a release APK
        run: ./gradlew :TMessagesProj:assembleRelease --no-daemon --no-build-cache -x lint
        env:
          NATIVE_TARGET: arm64-v8a
        timeout-minutes: 60

      - name: List built APKs
        if: always()
        run: |
          echo "=== Looking for APK files ==="
          find TMessagesProj/build/outputs/apk -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true
          echo "---"
          find . -name "*.apk" 2>/dev/null | head -20 || true

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NagramXF-lazy-connect-arm64-APK
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
          retention-days: 30
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            TMessagesProj/build/reports/
            **/build/outputs/logs/
          retention-days: 7
